# ── Docker Compose for running tests in an isolated container ────────────────
# Usage (from project root):
#   pnpm run test:docker              — unit tests only
#   RUN_E2E=1 pnpm run test:docker    — unit + e2e tests
#
# To rebuild after code changes:
#   docker compose -f tests/docker/docker-compose.test.yml build --no-cache
# ─────────────────────────────────────────────────────────────────────────────
services:
  test:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
    container_name: panel-test-runner
    environment:
      - RUN_E2E=${RUN_E2E:-0}
    working_dir: /opt/panel
    # Keep container alive for debugging (override in CI with --abort-on-container-exit)
    stdin_open: true
    tty: false
