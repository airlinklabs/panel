name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "views/**"
      - "public/**"
      - "storage/prisma/**"
      - "tests/**"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - ".github/.semgrep.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "views/**"
      - "public/**"
      - "storage/prisma/**"
      - "tests/**"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - ".github/.semgrep.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ── Path filter ──────────────────────────────────────────────────────────────

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      security: ${{ steps.filter.outputs.security }}
      quality: ${{ steps.filter.outputs.quality }}
      test: ${{ steps.filter.outputs.test }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            security:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'src/**'
              - '.github/.semgrep.yml'
            quality:
              - 'src/**'
              - 'tsconfig*.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
            test:
              - 'src/**'
              - 'tests/**'
              - 'storage/prisma/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            build:
              - 'src/**'
              - 'views/**'
              - 'public/**'
              - 'storage/prisma/**'
              - 'tsconfig*.json'
              - 'tailwind.config.*'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # ── Security ────────────────────────────────────────────────────────────────

  semgrep:
    name: SAST
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          if [ -f .github/.semgrep.yml ]; then
            semgrep ci --config .github/.semgrep.yml --verbose
          else
            semgrep ci --config auto --verbose
          fi

  dependency-review:
    name: Dependency Review
    needs: changes
    if: >
      needs.changes.outputs.security == 'true' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  audit:
    name: Audit
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - run: pnpm audit --audit-level=critical
        continue-on-error: true

  # ── Quality ─────────────────────────────────────────────────────────────────

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - run: pnpm exec eslint src

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/airlink_test"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run typecheck

  # ── Test ────────────────────────────────────────────────────────────────────

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/airlink_test"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma db push --skip-generate
      - run: pnpm test

  # ── Build ───────────────────────────────────────────────────────────────────

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/airlink_test"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run migrate:deploy
      - run: pnpm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ── CI Gate ─────────────────────────────────────────────────────────────────

  ci-gate:
    name: CI
    if: always()
    needs:
      - semgrep
      - dependency-review
      - audit
      - lint
      - typecheck
      - test
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "SAST:       ${{ needs.semgrep.result }}"
          echo "Dep Review: ${{ needs.dependency-review.result }}"
          echo "Audit:      ${{ needs.audit.result }}"
          echo "Lint:       ${{ needs.lint.result }}"
          echo "Typecheck:  ${{ needs.typecheck.result }}"
          echo "Test:       ${{ needs.test.result }}"
          echo "Build:      ${{ needs.build.result }}"

          for result in \
            "${{ needs.semgrep.result }}" \
            "${{ needs.dependency-review.result }}" \
            "${{ needs.audit.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}"; do
            if [ "$result" = "failure" ]; then
              echo "::error::One or more CI jobs failed"
              exit 1
            fi
          done

          echo "All checks passed or were skipped (no relevant changes)."
