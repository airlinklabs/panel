name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch/PR to avoid wasting minutes on stale pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read # needed for dependency-review

jobs:
  # ── Security ────────────────────────────────────────────────────────────────

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          if [ -f .github/.semgrep.yml ]; then
            semgrep ci --config .github/.semgrep.yml --verbose
          else
            semgrep ci --config auto --verbose
          fi
        # semgrep ci exits non-zero on findings by default; --error is not a valid flag

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only meaningful on PRs — compares base vs head for newly added vulns
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # --ignore-scripts skips postinstall (prisma generate), which requires
      # DATABASE_URL — audit doesn't need generated types at all
      - run: pnpm install --ignore-scripts
      - run: pnpm audit --audit-level=critical
        continue-on-error: true

  # ── Quality ─────────────────────────────────────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # --ignore-scripts skips postinstall; ESLint doesn't need Prisma types
      - run: pnpm install --ignore-scripts
      # --fix is for local dev only; CI must only check, never mutate files
      - run: pnpm exec eslint src

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: airlink_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/airlink_test"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # --ignore-scripts so postinstall doesn't race with our explicit generate below
      - run: pnpm install --ignore-scripts
      - run: pnpm exec prisma generate
      - run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: airlink_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/airlink_test"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --ignore-scripts
      - run: pnpm exec prisma generate
      - run: pnpm run migrate:deploy
      - run: pnpm test

  # ── Build ───────────────────────────────────────────────────────────────────

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [semgrep, lint, typecheck, test, audit]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: airlink_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/airlink_test"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --ignore-scripts
      # migrate:deploy: applies migrations and regenerates the Prisma client
      # with DATABASE_URL in scope — this is what postinstall was trying to do
      - run: pnpm run migrate:deploy
      # build = tsc (main) + tsc (prisma tsconfig) + tailwindcss
      - run: pnpm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
